services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Developer"
            # Dev-only default, documented in the README. Override with an environment variable.
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Banking_Dev_Only_2026!}"
        ports:
            # Loopback only: the documented password is never reachable from other machines.
            - "127.0.0.1:1433:1433"
        volumes:
            - sqlserver-data:/var/opt/mssql
        healthcheck:
            test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

    api:
        build:
            context: .
            dockerfile: BankingAPI/BankingAPI/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: "Demo"
            ConnectionStrings__Banking: "Server=sqlserver,1433;Database=Banking;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Banking_Dev_Only_2026!};TrustServerCertificate=True"
            Jwt__SigningKey: "${JWT_SIGNING_KEY:-demo-only-signing-key-not-for-production-0123}"
        ports:
            - "127.0.0.1:5001:8080"
        depends_on:
            sqlserver:
                condition: service_healthy
        healthcheck:
            test: [ "CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8080/health/ready" ]
            interval: 10s
            timeout: 6s
            retries: 5
            start_period: 15s

    client:
        build:
            context: .
            dockerfile: BankingClient/BankingClient/Dockerfile
        environment:
            ASPNETCORE_ENVIRONMENT: "Demo"
        ports:
            - "127.0.0.1:5002:8080"
        depends_on:
            api:
                condition: service_healthy

volumes:
    sqlserver-data:
