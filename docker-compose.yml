services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Developer"
            # Dev-only default, documented in the README. Override with an environment variable.
            MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Banking_Dev_Only_2026!}"
        ports:
            # Loopback only: the documented password is never reachable from other machines.
            - "127.0.0.1:1433:1433"
        volumes:
            - sqlserver-data:/var/opt/mssql
        healthcheck:
            test: [ "CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null" ]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 20s

volumes:
    sqlserver-data:
